name: Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality-and-unit-tests:
    # Pinned: ubuntu-latest moved to 26.04, where `playwright install chromium`
    # fails ("Playwright does not support chromium on ubuntu26.04-x64").
    # Unpin once Playwright supports 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.28
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('examples/react-viewer/package.json') }}
      - run: pnpm --filter @toolpath/example-react-viewer exec playwright install chromium
      - run: pnpm check
      # Proves the Python SDK still builds as the wheel the release attaches to GitHub.
      - run: pnpm package:python-sdk
