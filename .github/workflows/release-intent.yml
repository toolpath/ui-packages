name: Release intent

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Public package release intent
    # A maintainer may apply this label for source changes that deliberately do
    # not affect a package consumer. The PR template requires an explanation.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-release-needed') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: node scripts/check-release-intent.mjs "origin/${{ github.base_ref }}"

  production-contract:
    name: Production Engine API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: node scripts/check-production-api-contract.mjs "origin/${{ github.base_ref }}"
