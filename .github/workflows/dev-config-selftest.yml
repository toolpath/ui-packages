# @toolpath/dev-config's own CI, alongside the repository's existing workflows.
# None of it needs SDK generation, Docker, uv, credentials, or an emulator.
name: dev-config selftest

on:
  pull_request:
    paths:
      - packages/dev-config/**
      - .github/actions/dev-config-*/**
      - .github/workflows/dev-config-*.yml
      - lint-staged.config.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  push:
    branches:
      - main
    paths:
      - packages/dev-config/**
      - .github/actions/dev-config-*/**
      - .github/workflows/dev-config-*.yml
      - lint-staged.config.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The package's complete gate: the read-only format backstop, lint, types and
  # unit tests, then packed-artifact and compatibility checks.
  package:
    name: package gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @toolpath/dev-config build
      - name: Standards
        working-directory: packages/dev-config
        run: node dist/cli/main.js ci --stage standards --receipt-dir "$RUNNER_TEMP/receipts"
      - run: pnpm --filter @toolpath/dev-config test:package
      - id: playwright
        working-directory: packages/dev-config/node_modules/@playwright/test
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: >-
            playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # The compatibility matrix's browser suite needs Chromium; installed explicitly.
      - run: pnpm --filter @toolpath/dev-config exec playwright install --with-deps chromium
      - run: pnpm --filter @toolpath/dev-config test:compatibility
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-config-package-failure
          path: |
            ${{ runner.temp }}/receipts
            packages/dev-config/.tmp
            !**/.env*
          if-no-files-found: ignore
          retention-days: 7

  # Static validation of the shared workflow and this one with the official
  # actionlint release binary, verified against its published SHA-256.
  workflows:
    name: workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        env:
          ACTIONLINT_URL: >-
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" \
            "$ACTIONLINT_URL"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      # actionlint 1.7.12 predates GitHub's documented job.workflow_repository,
      # job.workflow_sha, job.workflow_ref and job.workflow_file_path properties,
      # which the shared workflow needs to check out its own source. Only that
      # message is ignored; every other check applies.
      - name: Lint the shared workflow
        env:
          UNKNOWN_JOB_PROPERTIES: >-
            property "workflow_(repository|sha|ref|file_path)" is not defined in object type
        run: >-
          "$RUNNER_TEMP/actionlint" -ignore "$UNKNOWN_JOB_PROPERTIES"
          .github/workflows/dev-config-quality.yml .github/workflows/dev-config-selftest.yml

  # The real setup, check and result actions against disposable generic
  # consumers installed from the packed package, at this run's revision.
  consumer-npm:
    name: actions (npm consumer)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      receipt: ${{ steps.verify.outputs.receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @toolpath/dev-config build
      - name: Create the consumer
        run: >-
          node packages/dev-config/scripts/ci-selftest.mjs consumer --package-manager npm
          --sha "$GITHUB_SHA" --out "$RUNNER_TEMP/consumer"
      - id: setup
        uses: ./.github/actions/dev-config-setup
        with:
          working-directory: ${{ runner.temp }}/consumer
      - uses: ./.github/actions/dev-config-check
        with:
          working-directory: ${{ runner.temp }}/consumer
          stage: standards
          receipt-dir: ${{ runner.temp }}/receipts/standards
      - uses: ./.github/actions/dev-config-check
        with:
          working-directory: ${{ runner.temp }}/consumer
          suite: fixture:smoke
          receipt-dir: ${{ runner.temp }}/receipts/smoke
      # This job ran the standards stages and the plan's one central suite, so it
      # stands in for the reusable workflow's standards and suites jobs here.
      - id: verify
        uses: ./.github/actions/dev-config-result
        with:
          needs: >-
            {"standards": {"result": "success"}, "suites": {"result": "success"}}
          plan: ${{ steps.setup.outputs.plan }}
          receipts: ${{ runner.temp }}/receipts
      - name: The format backstop reports and never rewrites
        run: >-
          node packages/dev-config/scripts/ci-selftest.mjs format-backstop
          --consumer "$RUNNER_TEMP/consumer"

  consumer-pnpm:
    name: actions (pnpm consumer)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      receipt: ${{ steps.verify.outputs.receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @toolpath/dev-config build
      - name: Create the consumer
        run: >-
          node packages/dev-config/scripts/ci-selftest.mjs consumer --package-manager pnpm
          --sha "$GITHUB_SHA" --out "$RUNNER_TEMP/consumer"
      - id: setup
        uses: ./.github/actions/dev-config-setup
        with:
          working-directory: ${{ runner.temp }}/consumer
      - uses: ./.github/actions/dev-config-check
        with:
          working-directory: ${{ runner.temp }}/consumer
          stage: standards
          receipt-dir: ${{ runner.temp }}/receipts/standards
      - uses: ./.github/actions/dev-config-check
        with:
          working-directory: ${{ runner.temp }}/consumer
          suite: fixture:smoke
          receipt-dir: ${{ runner.temp }}/receipts/smoke
      - id: verify
        uses: ./.github/actions/dev-config-result
        with:
          needs: >-
            {"standards": {"result": "success"}, "suites": {"result": "success"}}
          plan: ${{ steps.setup.outputs.plan }}
          receipts: ${{ runner.temp }}/receipts

  # The aggregate a generated caller runs, over real job results and outputs.
  aggregate:
    name: aggregate
    if: always()
    needs: [consumer-npm, consumer-pnpm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-config-result
        with:
          needs: ${{ toJSON(needs) }}
          required: |
            [
              {"kind": "standards", "job": "consumer-npm"},
              {"kind": "standards", "job": "consumer-pnpm"}
            ]
