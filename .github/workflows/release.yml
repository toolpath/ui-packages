name: Release public packages

on:
  push:
    branches:
      - main
    paths:
      - .changeset/**
      - .github/workflows/release.yml
      - packages/app-support/src/**
      - packages/app-support/package.json
      - packages/dfm/src/**
      - packages/dfm/package.json
      - packages/plan/src/**
      - packages/plan/package.json
      - packages/quoting/src/**
      - packages/quoting/package.json
      - packages/ui/src/**
      - packages/ui/tailwind-preset.cjs
      - packages/ui/package.json
      - packages/viewer/src/**
      - packages/viewer/package.json
      - packages/sdk-typescript/src/**
      - packages/sdk-typescript/package.json
      - packages/tool-drawing/src/**
      - packages/tool-drawing/package.json
      - packages/tool-scraper/src/**
      - packages/tool-scraper/package.json
      - packages/tool-support/src/**
      - packages/tool-support/package.json
      - openapi/**
      - codegen/typescript-fetch.yaml
      - scripts/generate-sdks.mjs
  # Without inputs this is the ordinary release run. With `services_sha` it is a
  # staging prerelease of @toolpath/api instead (see the sdk-prerelease job).
  workflow_dispatch:
    inputs:
      services_sha:
        description: >-
          services commit to publish an @toolpath/api staging prerelease for
          (blank: an ordinary release run)
        type: string
        default: ''
      api_version:
        description: 'Engine API version staging must serve (blank: not checked)'
        type: string
        default: ''
      dry_run:
        description: Build and check the prerelease without publishing it
        type: boolean
        default: true
  # services' staging workflow, once Engine staging acceptance passes.
  repository_dispatch:
    types: [engine-api-staging]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  quality:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.services_sha == '')
    uses: ./.github/workflows/_quality.yml

  release:
    needs: quality
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.services_sha == '')
    runs-on: ubuntu-latest
    outputs:
      python_sdk_required: ${{ steps.python-sdk.outputs.required }}
      python_sdk_tag: ${{ steps.python-sdk.outputs.tag }}
      # The commit this run released, for the Python job to build the same versions.
      released_sha: ${{ steps.python-sdk.outputs.sha }}
    # Its own group, separate from the prerelease's, so neither can cancel or
    # delay the other.
    concurrency:
      group: npm-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@11.19.0

      - name: Create Toolpath release-bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TOOLPATH_ACTIONS_BOT_APP_ID }}
          private-key: ${{ secrets.TOOLPATH_ACTIONS_BOT_PK }}
          owner: toolpath
          repositories: ui-packages

      # Pending Changesets create or update the release-metadata PR. Once that
      # PR merges, this action publishes only npm versions absent from npm.
      - name: Version or publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version: pnpm version-packages
          publish: pnpm release:npm
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'

      # npm cannot configure a trusted publisher for a package until that package exists.
      # Leave first-package release PRs open so a maintainer can run the documented bootstrap.
      - name: Check whether a release needs an initial npm publish
        id: npm-bootstrap
        if: steps.changesets.outputs.pullRequestNumber != ''
        run: node scripts/check-npm-package-bootstrap.mjs

      - name: Explain the initial npm publish
        if: >-
          steps.changesets.outputs.pullRequestNumber != '' &&
          steps.npm-bootstrap.outputs.required == 'true'
        run: |
          gh pr comment "${{ steps.changesets.outputs.pullRequestNumber }}" --body "$(cat <<'EOF'
          This release adds a package that npm has not seen before. It will not auto-merge.

          From a local checkout, run:

          ```sh
          gh pr checkout ${{ steps.changesets.outputs.pullRequestNumber }}
          pnpm install --frozen-lockfile
          npm login
          for package in ${{ steps.npm-bootstrap.outputs.packages }}; do
            pnpm bootstrap:npm-package "$package"
          done
          ```

          Then merge this release PR. Future releases publish automatically with trusted publishing.
          EOF
          )"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # The App-created PR triggers ordinary pull-request CI. GitHub merges it
      # only after the repository's protected-branch requirements succeed.
      - name: Enable auto-merge for the release-metadata PR
        if: >-
          steps.changesets.outputs.pullRequestNumber != '' &&
          steps.npm-bootstrap.outputs.required != 'true'
        run: gh pr merge "${{ steps.changesets.outputs.pullRequestNumber }}" --auto --squash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # With no release PR pending, this run published (or found published) every npm
      # version. The Python SDK shares @toolpath/api's version and follows whenever its
      # GitHub release is missing: after a release, a manual run, or a re-run.
      - name: Check whether the Python SDK needs a release
        id: python-sdk
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          node scripts/check-python-sdk-release.mjs
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  # Attaches the Python SDK (`toolpath`) wheel to a GitHub release, `python-sdk-v<version>`,
  # for `uv add` / `pip install` from its URL (docs/PYTHON-SDK-RELEASES.md). Both SDKs are
  # generated from one contract and share one version.
  python-sdk-release:
    needs: release
    # A released version is permanent, so only main may release one.
    if: >-
      needs.release.outputs.python_sdk_required == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: python-sdk-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.released_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.28
          python-version: '3.11'

      - run: pnpm install --frozen-lockfile
      - run: pnpm package:python-sdk

      - name: Install the wheel in a clean environment
        run: |
          venv="$RUNNER_TEMP/toolpath-wheel-check"
          uv venv "$venv"
          uv pip install --python "$venv" artifacts/toolpath-*-py3-none-any.whl
          "$venv/bin/python" -I -c "import toolpath"

      # Skips a release another run created meanwhile, so a re-run is safe.
      - name: Create the GitHub release
        run: |
          if answer="$(gh release view "$TAG" 2>&1)"; then
            echo "Release $TAG exists."
            exit 0
          fi
          if [[ "$answer" != *"release not found"* ]]; then
            echo "$answer" >&2
            exit 1
          fi
          wheel="artifacts/toolpath-${TAG#python-sdk-v}-py3-none-any.whl"
          if [ ! -f "$wheel" ]; then
            echo "::error::The build did not produce $wheel; its version does not match $TAG."
            exit 1
          fi
          downloads="https://github.com/${GITHUB_REPOSITORY}/releases/download"
          url="${downloads}/${TAG}/$(basename "$wheel")"
          notes="$(printf 'Install with uv:\n\n```sh\nuv add "toolpath @ %s"\n```\n' "$url")"
          gh release create "$TAG" "$wheel" --target "$RELEASED_SHA" --latest=false \
            --title "toolpath (Python SDK) ${TAG#python-sdk-v}" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.python_sdk_tag }}
          RELEASED_SHA: ${{ needs.release.outputs.released_sha }}

  # Publishes @toolpath/api under npm's `staging` dist-tag from the contract Engine
  # staging serves. It commits nothing and never moves `latest`. It lives in this
  # file because npm's trusted publisher is bound to the workflow file name
  # (docs/BOOTSTRAPPING-NPM-PACKAGES.md); a job elsewhere could not publish.
  sdk-prerelease:
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && inputs.services_sha != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-release-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # `pnpm generate` regenerates the Python SDK alongside the TypeScript one.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.28
          python-version: '3.11'

      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@11.19.0

      # A manual run is a dry run unless asked otherwise; a run off main always is,
      # because the trusted publisher only vouches for main.
      - run: pnpm release:sdk-prerelease
        env:
          SERVICES_SHA: ${{ github.event.client_payload.services_sha || inputs.services_sha }}
          EXPECTED_API_VERSION: ${{ github.event.client_payload.api_version || inputs.api_version }}
          EXPECTED_SHA256: ${{ github.event.client_payload.contract_sha256 }}
          SERVICES_RUN_URL: ${{ github.event.client_payload.run_url }}
          DRY_RUN: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) ||
            github.ref != 'refs/heads/main' }}

  notify-prerelease-failure:
    needs: sdk-prerelease
    if: always() && needs.sdk-prerelease.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # SLACK_BOT_TOKEN is an organization secret that this public repository may
    # not see; a failed post must not stand in for the failure it reports.
    continue-on-error: true
    steps:
      - uses: slackapi/slack-github-action@v2.1.1
        env:
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: dev-notifications
            text: >-
              @toolpath/api staging prerelease failed for services
              ${{ github.event.client_payload.services_sha || inputs.services_sha }}.
              <${{ env.RUN_URL }}|View workflow run>.
