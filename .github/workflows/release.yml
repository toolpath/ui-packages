name: Release public packages

# The packages are developed, versioned and reviewed in a private monorepo, which mirrors
# `packages/` and `pnpm-lock.yaml` here. For each release it pushes a tag `release-<12-char sha>`
# on a commit whose `packages/` hold exactly the released code, and this workflow publishes from
# that tag. A push to `main` never publishes. npm trusted publishing is bound to this repository
# and this file name, so the file keeps its name.
on:
  push:
    tags:
      - 'release-*'
  # A staging prerelease of @toolpath/api, run by hand. The private monorepo's staging deploy
  # sends the repository_dispatch below instead; both run the sdk-prerelease job.
  workflow_dispatch:
    inputs:
      services_sha:
        description: Source commit the staging contract came from (7-40 hex)
        type: string
        required: true
      api_version:
        description: 'Engine API version staging must serve (blank: not checked)'
        type: string
        default: ''
      dry_run:
        description: Build and check the prerelease without publishing it
        type: boolean
        default: true
  # Sent once Engine staging acceptance passes, with client_payload
  # { services_sha, api_version, contract_sha256, run_url }.
  repository_dispatch:
    types: [engine-api-staging]

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # contents: write pushes the version tags and creates their GitHub releases; id-token: write
    # is npm trusted publishing and provenance.
    permissions:
      contents: write
      id-token: write
    # Its own group, separate from the prerelease's, so neither can cancel or delay the other.
    concurrency:
      group: npm-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Only the tag push below needs a token.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # The Python SDK's tests and wheel need uv.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.28
          python-version: '3.11'

      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@11.19.0

      - run: pnpm build
      - run: pnpm test

      # `changeset publish` publishes only versions absent from npm, so a tag that carries no new
      # version publishes nothing, and it tags each version it publishes on this commit. Then
      # `changeset tag` tags any version an earlier run published but failed to tag.
      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pnpm exec changeset publish
          pnpm exec changeset tag

      # Each version tag gets a GitHub release with its CHANGELOG section, unless it has one.
      - name: Push the version tags and create their GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t tags < <(git tag --points-at HEAD --list '@toolpath/*@*')
          if [ "${#tags[@]}" -eq 0 ]; then
            echo 'This run created no package tags.'
            exit 0
          fi

          # The checkout keeps no credentials, so only this push carries the token.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin "${tags[@]}"

          for tag in "${tags[@]}"; do
            if answer="$(gh release view "$tag" 2>&1)"; then
              echo "Release $tag exists."
              continue
            fi
            if [[ "$answer" != *"release not found"* ]]; then
              echo "$answer" >&2
              exit 1
            fi
            name="${tag%@*}"
            version="${tag##*@}"
            manifest="$(grep -lF "\"name\": \"$name\"" packages/*/package.json | head -n 1)"
            notes="$RUNNER_TEMP/release-notes.md"
            awk -v heading="## $version" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' "$(dirname "$manifest")/CHANGELOG.md" > "$notes"
            if [ ! -s "$notes" ]; then
              echo "::error::The $name CHANGELOG has no section for $version."
              exit 1
            fi
            prerelease=()
            if [[ "$version" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes" \
              "${prerelease[@]}"
          done

      # The Python SDK (`toolpath`) shares @toolpath/api's version and ships as a wheel on the
      # GitHub release `python-sdk-v<version>`, built from this tag whenever that release is
      # missing. A re-run skips a release that exists.
      - name: Release the Python SDK if its version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./packages/sdk-typescript/package.json').version")"
          tag="python-sdk-v$version"
          if answer="$(gh release view "$tag" 2>&1)"; then
            echo "Release $tag exists."
            exit 0
          fi
          if [[ "$answer" != *"release not found"* ]]; then
            echo "$answer" >&2
            exit 1
          fi

          pnpm --filter @toolpath/sdk-python package
          wheel="packages/sdk-python/dist/toolpath-${version}-py3-none-any.whl"
          if [ ! -f "$wheel" ]; then
            echo "::error::The build did not produce $wheel; its version does not match $tag."
            exit 1
          fi
          venv="$RUNNER_TEMP/toolpath-wheel-check"
          uv venv "$venv"
          uv pip install --python "$venv" "$wheel"
          "$venv/bin/python" -I -c "import toolpath"

          downloads="https://github.com/${GITHUB_REPOSITORY}/releases/download"
          url="${downloads}/${tag}/$(basename "$wheel")"
          fence="\`\`\`"
          notes="$RUNNER_TEMP/python-sdk-notes.md"
          printf 'Install with uv:\n\n%ssh\nuv add "toolpath @ %s"\n%s\n' "$fence" "$url" "$fence" \
            > "$notes"
          gh release create "$tag" "$wheel" --target "$GITHUB_SHA" --latest=false \
            --title "toolpath (Python SDK) $version" --notes-file "$notes"

  # Publishes @toolpath/api under npm's `staging` dist-tag from the contract Engine staging
  # serves. It commits nothing and never moves `latest`. It lives in this file because each
  # package's npm trusted publisher is bound to this repository and this file name.
  sdk-prerelease:
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-release-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@11.19.0

      # A manual run is a dry run unless asked otherwise; a run off main always is, so only
      # main's mirrored packages reach npm.
      - run: node scripts/publish-sdk-prerelease.mjs
        env:
          SOURCE_SHA: ${{ github.event.client_payload.services_sha || inputs.services_sha }}
          EXPECTED_API_VERSION: ${{ github.event.client_payload.api_version || inputs.api_version }}
          EXPECTED_SHA256: ${{ github.event.client_payload.contract_sha256 }}
          SOURCE_RUN_URL: ${{ github.event.client_payload.run_url }}
          DRY_RUN: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) ||
            github.ref != 'refs/heads/main' }}

  # A failed prerelease fails sdk-prerelease, and with it this run, so it shows red whether or
  # not Slack hears of it. This job only adds the Slack post, and only where SLACK_BOT_TOKEN is
  # visible: it is an organization secret this public repository may not be granted.
  notify-prerelease-failure:
    needs: sdk-prerelease
    if: always() && needs.sdk-prerelease.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Note that Slack is not configured
        if: env.SLACK_BOT_TOKEN == ''
        run: echo '::warning::SLACK_BOT_TOKEN is not available here, so Slack was not told.'

      # A failed post must not stand in for the failure it reports.
      - if: env.SLACK_BOT_TOKEN != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        env:
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            channel: dev-notifications
            text: >-
              @toolpath/api staging prerelease failed for source commit
              ${{ github.event.client_payload.services_sha || inputs.services_sha }}.
              <${{ env.RUN_URL }}|View workflow run>.
