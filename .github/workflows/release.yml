name: Release public packages

on:
  push:
    branches:
      - main
    paths:
      - .changeset/**
      - .github/workflows/release.yml
      - packages/app-support/src/**
      - packages/app-support/package.json
      - packages/dfm/src/**
      - packages/dfm/dfm.css
      - packages/dfm/package.json
      - packages/ui/src/**
      - packages/ui/tailwind-preset.cjs
      - packages/ui/package.json
      - packages/viewer/src/**
      - packages/viewer/package.json
      - packages/sdk-typescript/src/**
      - packages/sdk-typescript/package.json
      - packages/tool-drawing/src/**
      - packages/tool-drawing/package.json
      - packages/tool-scraper/src/**
      - packages/tool-scraper/package.json
      - packages/tool-support/src/**
      - packages/tool-support/package.json
      - openapi/**
      - codegen/typescript-fetch.yaml
      - scripts/generate-sdks.mjs
  # Without inputs this is the ordinary release run. With `services_sha` it is a
  # staging prerelease of @toolpath/api instead (see the sdk-prerelease job).
  workflow_dispatch:
    inputs:
      services_sha:
        description: >-
          services commit to publish an @toolpath/api staging prerelease for
          (blank: an ordinary release run)
        type: string
        default: ''
      api_version:
        description: 'Engine API version staging must serve (blank: not checked)'
        type: string
        default: ''
      dry_run:
        description: Build and check the prerelease without publishing it
        type: boolean
        default: true
  # services' staging workflow, once Engine staging acceptance passes.
  repository_dispatch:
    types: [engine-api-staging]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  quality:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.services_sha == '')
    uses: ./.github/workflows/_quality.yml

  release:
    needs: quality
    # Only main releases; a run elsewhere would also take main's place in the queue.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.services_sha == ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      # Lets the job start a fresh release run when main moves under it.
      actions: write
    outputs:
      python_sdk_required: ${{ steps.pypi.outputs.required }}
    # Its own group, separate from the prerelease's, so neither can cancel or
    # delay the other.
    concurrency:
      group: npm-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@11.19.0

      # This token may push to main without a PR. Only the push in `version` uses it for
      # git; the checkout keeps the workflow's own token, which may not.
      - name: Create Toolpath release-bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TOOLPATH_ACTIONS_BOT_APP_ID }}
          private-key: ${{ secrets.TOOLPATH_ACTIONS_BOT_PK }}
          owner: toolpath
          repositories: ui-packages
          permission-contents: write
          permission-pull-requests: write

      - name: Check for pending Changesets
        id: pending
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      # npm cannot configure a trusted publisher for a package until that package exists.
      # A release with a new package goes through a release-metadata PR instead, left open
      # so a maintainer can run the documented bootstrap (docs/BOOTSTRAPPING-NPM-PACKAGES.md).
      - name: Check whether a release needs an initial npm publish
        id: npm-bootstrap
        if: steps.pending.outputs.pending == 'true'
        run: node scripts/check-npm-package-bootstrap.mjs

      # Every other release is versioned straight on main, with no release-metadata PR:
      # the merge that brings a Changeset publishes it. Main's protection lets only the
      # bot push without a PR.
      - name: Version packages on main
        id: version
        if: >-
          steps.pending.outputs.pending == 'true' &&
          steps.npm-bootstrap.outputs.required != 'true'
        run: |
          pnpm version-packages
          bot_id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add --all
          git commit --message 'chore(release): version packages'
          # The empty extraheader drops the checkout's token, so git pushes as the bot.
          bot_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -c http.https://github.com/.extraheader= push "$bot_remote" HEAD:main; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "::error::The release bot could not push to main. If this repeats, check that" \
              "${APP_SLUG} may bypass main's pull-request rule."
            exit 1
          fi
          # main moved since this run checked it out (another merge, or a re-run of an old
          # run). Publishing here would skip what moved it, so a fresh run on main releases
          # these Changesets instead.
          GH_TOKEN="$WORKFLOW_TOKEN" gh workflow run release.yml --ref main
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "::notice::main moved during this release; a fresh run on main releases it."
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WORKFLOW_TOKEN: ${{ github.token }}

      # With the Changesets spent, this publishes only npm versions absent from npm and
      # creates their tags and GitHub releases. With a new package pending, it opens or
      # updates the release-metadata PR instead.
      - name: Publish packages
        id: changesets
        if: >-
          steps.pending.outputs.pending != 'true' ||
          steps.npm-bootstrap.outputs.required == 'true' ||
          steps.version.outputs.moved == 'false'
        uses: changesets/action@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version: pnpm version-packages
          publish: pnpm release:npm
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'

      - name: Explain the initial npm publish
        if: steps.changesets.outputs.pullRequestNumber != ''
        run: |
          gh pr comment "${{ steps.changesets.outputs.pullRequestNumber }}" --body "$(cat <<'EOF'
          This release adds a package that npm has not seen before. It will not publish until
          a maintainer bootstraps it.

          From a local checkout, run:

          ```sh
          gh pr checkout ${{ steps.changesets.outputs.pullRequestNumber }}
          pnpm install --frozen-lockfile
          npm login
          for package in ${{ steps.npm-bootstrap.outputs.packages }}; do
            pnpm bootstrap:npm-package "$package"
          done
          ```

          Then merge this release PR. Future releases publish automatically with trusted publishing.
          EOF
          )"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # With no release PR pending, this run published (or found published) every npm
      # version. The Python SDK shares @toolpath/api's version and follows whenever
      # PyPI lacks it: after a release, a manual run, or a re-run.
      - name: Check whether PyPI needs the Python SDK
        id: pypi
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/check-pypi-release.mjs

  # Publishes the Python SDK (`toolpath`) to PyPI. Both SDKs are generated from one
  # contract and share one version. PyPI's trusted publisher is bound to this file
  # name and the `pypi` environment (docs/PUBLISHING-PYTHON-SDK.md).
  python-sdk-publish:
    needs: release
    # PyPI never takes a version twice, so only main may publish one.
    if: >-
      needs.release.outputs.python_sdk_required == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/toolpath/
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pypi-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.28
          python-version: '3.11'

      - run: pnpm install --frozen-lockfile
      - run: pnpm package:python-sdk

      - name: Install the wheel in a clean environment
        run: |
          venv="$RUNNER_TEMP/toolpath-wheel-check"
          uv venv "$venv"
          uv pip install --python "$venv" artifacts/toolpath-*-py3-none-any.whl
          "$venv/bin/python" -I -c "import toolpath"

      # --check-url skips a version PyPI already has, so a re-run is safe.
      - run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          artifacts/toolpath-*-py3-none-any.whl

  # Publishes @toolpath/api under npm's `staging` dist-tag from the contract Engine
  # staging serves. It commits nothing and never moves `latest`. It lives in this
  # file because npm's trusted publisher is bound to the workflow file name
  # (docs/BOOTSTRAPPING-NPM-PACKAGES.md); a job elsewhere could not publish.
  sdk-prerelease:
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && inputs.services_sha != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-release-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # `pnpm generate` regenerates the Python SDK alongside the TypeScript one.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.28
          python-version: '3.11'

      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@11.19.0

      # A manual run is a dry run unless asked otherwise; a run off main always is,
      # because the trusted publisher only vouches for main.
      - run: pnpm release:sdk-prerelease
        env:
          SERVICES_SHA: ${{ github.event.client_payload.services_sha || inputs.services_sha }}
          EXPECTED_API_VERSION: ${{ github.event.client_payload.api_version || inputs.api_version }}
          EXPECTED_SHA256: ${{ github.event.client_payload.contract_sha256 }}
          SERVICES_RUN_URL: ${{ github.event.client_payload.run_url }}
          DRY_RUN: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) ||
            github.ref != 'refs/heads/main' }}

  notify-prerelease-failure:
    needs: sdk-prerelease
    if: always() && needs.sdk-prerelease.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # SLACK_BOT_TOKEN is an organization secret that this public repository may
    # not see; a failed post must not stand in for the failure it reports.
    continue-on-error: true
    steps:
      - uses: slackapi/slack-github-action@v2.1.1
        env:
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: dev-notifications
            text: >-
              @toolpath/api staging prerelease failed for services
              ${{ github.event.client_payload.services_sha || inputs.services_sha }}.
              <${{ env.RUN_URL }}|View workflow run>.
