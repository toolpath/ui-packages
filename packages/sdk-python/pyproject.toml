[project]
name = "toolpath"
version = "0.14.0"
description = "Python bindings and upload helper for the Toolpath Engine API"
authors = [{ name = "Toolpath" }]
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
]

[project.urls]
Homepage = "https://developers.toolpath.com"
Repository = "https://github.com/toolpath/ui-packages"
Issues = "https://github.com/toolpath/ui-packages/issues"

[tool.uv.build-backend]
module-name = "toolpath"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]

[tool.toolpath]
openapi-sha256 = "43fc7670527f5f198770fb1942b23ca0ae5ed852fc00c756e2e1ce3eb6a97fe1"
openapi-version = "1.40.0"
